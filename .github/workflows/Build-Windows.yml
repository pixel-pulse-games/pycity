name: Build Windows Binaries

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag to create, e.g. v1.0.1"
        required: true
  push:
    branches: [main]
    paths:
      - "Src/**/*.c"
      - "Src/**/*.h"

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Create and push the version tag
        id: tag
        if: github.event_name == 'workflow_dispatch'
        run: |
          $tag = "${{ github.event.inputs.version }}"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Check the remote directly - a fresh checkout won't already have
          # tags from prior runs fetched locally, so `git tag -l` alone
          # would falsely report "doesn't exist" even when it does.
          $existing = git ls-remote --tags origin "refs/tags/$tag"
          if ($existing) {
            Write-Error "Tag $tag already exists on origin. Choose a version that hasn't been used."
            exit 1
          }

          git tag $tag
          git push origin $tag
          echo "tag=$tag" >> $env:GITHUB_OUTPUT

      - name: Install 64-bit mingw-w64 toolchain
        run: choco install mingw -y --no-progress

      - name: Install 32-bit mingw-w64 toolchain
        run: choco install mingw -y --no-progress --forcex86 --force

      - name: Locate compiler bin folders
        id: toolchains
        run: |
          # Confirmed from a real run: this mingw choco package installs both
          # architectures under C:\ProgramData\mingw64\ (mingw64\bin and
          # mingw32\bin side by side), not under chocolatey's own lib folder.
          # Search there first; fall back to a full ProgramData scan in case
          # a future package version changes the layout again.
          $gccs = Get-ChildItem -Path "C:\ProgramData\mingw64" -Recurse -Filter "gcc.exe" -ErrorAction SilentlyContinue
          if (-not $gccs) {
            $gccs = Get-ChildItem -Path "C:\ProgramData" -Recurse -Filter "gcc.exe" -ErrorAction SilentlyContinue
          }
          $w64 = $null
          $w32 = $null
          foreach ($g in $gccs) {
            $machine = & $g.FullName -dumpmachine
            if ($machine -like "x86_64*" -and -not $w64) { $w64 = $g.DirectoryName }
            if ($machine -like "i686*" -and -not $w32) { $w32 = $g.DirectoryName }
          }
          if (-not $w64) { Write-Error "Could not locate a 64-bit (x86_64) gcc.exe"; exit 1 }
          if (-not $w32) { Write-Error "Could not locate a 32-bit (i686) gcc.exe"; exit 1 }
          Write-Host "64-bit toolchain: $w64"
          Write-Host "32-bit toolchain: $w32"
          echo "w64=$w64" >> $env:GITHUB_OUTPUT
          echo "w32=$w32" >> $env:GITHUB_OUTPUT

      - name: Bridge mingw32-make.exe -> make.exe
        run: |
          foreach ($p in @("${{ steps.toolchains.outputs.w64 }}", "${{ steps.toolchains.outputs.w32 }}")) {
            $src = Join-Path $p "mingw32-make.exe"
            $dst = Join-Path $p "make.exe"
            if ((Test-Path $src) -and -not (Test-Path $dst)) {
              Copy-Item $src $dst
            }
          }

      - name: Write build.txt
        working-directory: Src
        run: |
          Set-Content -Encoding ascii -Path build.txt -Value "TARGET=all"
          Add-Content -Encoding ascii -Path build.txt -Value "W64_BIN_PATH=${{ steps.toolchains.outputs.w64 }}"
          Add-Content -Encoding ascii -Path build.txt -Value "W32_BIN_PATH=${{ steps.toolchains.outputs.w32 }}"

      - name: Run build.bat --CI
        working-directory: Src
        run: cmd /c "build.bat --CI"

      - name: Package build outputs into zips
        working-directory: Src
        run: |
          Compress-Archive -Path pycity-win64.exe,Bootstrap.exe,..\LICENSE -DestinationPath pycity-win64.zip -Force
          Compress-Archive -Path pycity-win32.exe,Bootstrap.exe,..\LICENSE -DestinationPath pycity-win32.zip -Force
          Compress-Archive -Path Patcher.exe,..\LICENSE -DestinationPath Patcher.zip -Force

      - name: Draft the release (create if new, update if it already exists)
        if: github.event_name == 'workflow_dispatch'
        env:
          GH_TOKEN: ${{ github.token }}
        working-directory: Src
        run: |
          $tag = "${{ steps.tag.outputs.tag }}"
          $exists = $true
          try {
            $info = gh release view $tag --repo "${{ github.repository }}" --json isDraft | ConvertFrom-Json
          } catch {
            $exists = $false
          }

          if ($exists) {
            if (-not $info.isDraft) {
              Write-Error "Release $tag is already published. Refusing to modify a live release - this workflow only ever touches drafts."
              exit 1
            }
            gh release upload $tag `
              pycity-win64.zip pycity-win32.zip Patcher.zip `
              --repo "${{ github.repository }}" `
              --clobber
          } else {
            gh release create $tag `
              pycity-win64.zip pycity-win32.zip Patcher.zip `
              --repo "${{ github.repository }}" `
              --title $tag `
              --draft `
              --generate-notes
          }

      - name: Upload build outputs as a workflow artifact (sanity-check runs)
        if: github.event_name == 'push'
        uses: actions/upload-artifact@v4
        with:
          name: pycity-build-${{ github.sha }}
          path: |
            Src/pycity-win64.zip
            Src/pycity-win32.zip
            Src/Patcher.zip
          retention-days: 14