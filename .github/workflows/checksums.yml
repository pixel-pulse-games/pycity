name: Generate checksums.txt

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to generate checksums for (defaults to latest)"
        required: false

permissions:
  contents: write

jobs:
  checksums:
    runs-on: windows-latest
    defaults:
      run:
        shell: powershell
    steps:
      - name: Determine target tag
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ("${{ github.event.inputs.tag }}") {
            echo "tag=${{ github.event.inputs.tag }}" >> $env:GITHUB_OUTPUT
          } elseif ("${{ github.event.release.tag_name }}") {
            echo "tag=${{ github.event.release.tag_name }}" >> $env:GITHUB_OUTPUT
          } else {
            $latest = gh release view --repo "${{ github.repository }}" --json tagName -q .tagName
            echo "tag=$latest" >> $env:GITHUB_OUTPUT
          }

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "${{ steps.tag.outputs.tag }}" `
            --repo "${{ github.repository }}" `
            --pattern "*.zip" `
            --dir assets

      - name: Generate checksums.txt
        run: |
          cd assets
          $files = Get-ChildItem -Filter *.zip
          $unorderedLines = @{}
          $extraLines = @()
          
          # Compute hashes and map them to their dynamic short names
          foreach ($file in $files) {
            $hash = (Get-FileHash $file.FullName -Algorithm SHA256).Hash.ToLower()
            if ($file.BaseName -eq "pycity-win64") { $name = "win64" }
            elseif ($file.BaseName -eq "pycity-win32") { $name = "win32" }
            else { $name = $file.BaseName.ToLower() }
            
            # Store known formats in a map, append others to a fallback list
            if ($name -match "^(win64|win32|patcher)$") {
              $unorderedLines[$name] = "$name=$hash"
            } else {
              $extraLines += "$name=$hash"
            }
          }
          
          # Enforce the explicit sequence order
          $finalLines = @()
          foreach ($key in "win64", "win32", "patcher") {
            if ($unorderedLines.ContainsKey($key)) {
              $finalLines += $unorderedLines[$key]
            }
          }
          
          # Append any unexpected zip files at the bottom
          $finalLines += $extraLines
          
          # Write out strictly sequenced line blocks
          $finalLines | Out-File -Encoding ascii checksums.txt
          Get-Content checksums.txt

      - name: Upload checksums.txt to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "${{ steps.tag.outputs.tag }}" `
            assets/checksums.txt `
            --repo "${{ github.repository }}" `
            --clobber
